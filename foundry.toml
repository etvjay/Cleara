[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@gluwa/usc-contracts/=node_modules/@gluwa/usc-contracts/"
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
