name: Contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "foundry.toml"
      - "package.json"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - run: corepack enable
      - run: corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --no-frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.7.1

      - run: forge --version
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
