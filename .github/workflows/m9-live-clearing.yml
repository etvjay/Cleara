name: M9 Live Bilateral Clearing

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/m9-live-clearing.trigger"

permissions:
  contents: read

concurrency:
  group: m9-live-clearing
  cancel-in-progress: false

jobs:
  clearing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet
    env:
      CREDITCOIN_RPC_HTTP: "https://rpc.cc3-testnet.creditcoin.network"
      CC3_DEPLOYER_PRIVATE_KEY: ${{ secrets.CC3_DEPLOYER_PRIVATE_KEY }}
      EVIDENCE_PATH: evidence/runtime/m9-clearing.json

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - run: corepack enable
      - run: corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --no-frozen-lockfile

      - name: Assert required testnet signer secret
        shell: bash
        run: |
          test -n "$CC3_DEPLOYER_PRIVATE_KEY" || { echo "Missing CC3_DEPLOYER_PRIVATE_KEY"; exit 1; }

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.7.1

      - name: Build and property gate
        run: |
          forge fmt --check
          forge build --sizes
          forge test -vvv

      - name: Execute live M9 bilateral clearing
        run: pnpm live:m9:clearing

      - name: Upload M9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-clearing-${{ github.run_id }}
          path: evidence/runtime/m9-clearing.json
          if-no-files-found: warn
          retention-days: 90
